[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "mymusic"
version = "0.1.0"
description = "Легкий настольный плеер интернет-музыки Audius для Windows"
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0"]

[project.scripts]
mymusic = "mymusic.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
